<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FORJA SUMMIT — Telão Oficial 9152×2106</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg-obsidian: #080604;
      --bg-amber-deep: #181108;
      --gold-primary: #d8af63;
      --gold-light: #f4dca8;
      --gold-dark: #8a6427;
      --off-white: #f7f3eb;
      --muted-cream: rgba(247, 243, 235, 0.72);
      --glass-bg: rgba(18, 13, 8, 0.76);
      --glass-border: rgba(216, 175, 99, 0.34);

      --font-display: 'Cinzel', serif;
      --font-editorial: 'Cormorant Garamond', serif;
      --font-ui: 'Plus Jakarta Sans', sans-serif;

      --stage-w: 9152px;
      --stage-h: 2106px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #030201;
      overflow: hidden;
      font-family: var(--font-ui);
      color: var(--off-white);
    }

    #viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: #030201;
    }

    #stage {
      width: var(--stage-w);
      min-width: var(--stage-w);
      height: var(--stage-h);
      min-height: var(--stage-h);
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse 46% 85% at 50% 54%, rgba(164, 114, 42, 0.22) 0%, rgba(45, 29, 11, 0.44) 48%, rgba(8, 6, 4, 0.99) 100%),
        linear-gradient(180deg, #0b0805 0%, #120c06 50%, #070503 100%);
      transform-origin: center center;
      box-shadow: 0 0 180px rgba(0, 0, 0, 0.96);
    }

    #viewport.pseudo-fullscreen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9998;
      background: #030201;
    }

    .stage-grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.045;
      background-image: radial-gradient(rgba(244, 220, 168, 0.5) 1px, transparent 0);
      background-size: 18px 18px;
      z-index: 2;
    }

    #waves-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      transition: opacity 0.8s ease, filter 0.8s ease;
    }

    #stage.is-floating #waves-canvas {
      opacity: 0.34;
      filter: blur(4px);
    }

    #zone-guides {
      position: absolute;
      inset: 0;
      z-index: 90;
      pointer-events: none;
      display: none;
    }
    #zone-guides.visible {
      display: block;
    }
    .zone-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 4px;
      background: repeating-linear-gradient(
        to bottom,
        rgba(216, 175, 99, 0.75) 0 36px,
        transparent 36px 72px
      );
    }
    .zone-line.left { left: 25%; }
    .zone-line.right { left: 75%; }
    .zone-badge {
      position: absolute;
      top: 48px;
      padding: 16px 32px;
      background: rgba(8, 6, 4, 0.85);
      border: 2px solid var(--gold-primary);
      border-radius: 14px;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--gold-light);
    }

    .side-wing {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 25%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 112px 156px 128px 170px;
      transition: opacity 0.65s ease, transform 0.65s ease;
    }
    .side-wing.left {
      left: 0;
      border-right: 1px solid rgba(216, 175, 99, 0.18);
      background: linear-gradient(90deg, rgba(6, 4, 2, 0.72) 0%, transparent 100%);
    }
    .side-wing.right {
      right: 0;
      border-left: 1px solid rgba(216, 175, 99, 0.18);
      background: linear-gradient(270deg, rgba(6, 4, 2, 0.72) 0%, transparent 100%);
    }

    #stage.is-floating .side-wing {
      opacity: 0.45;
    }

    .left-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .left-top-eyebrow {
      font-size: 36px;
      font-weight: 600;
      letter-spacing: 0.42em;
      color: rgba(247, 243, 235, 0.68);
      text-transform: uppercase;
    }
    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 22px;
      padding: 20px 48px;
      border-radius: 999px;
      border: 2px solid rgba(216, 175, 99, 0.48);
      background: rgba(18, 13, 8, 0.78);
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 0.28em;
      color: var(--gold-light);
    }
    .live-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--gold-light);
      box-shadow: 0 0 24px var(--gold-primary);
      animation: pulseDot 2.2s ease-in-out infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.82); }
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 72px;
      margin-top: -16px;
    }
    .monogram-box {
      width: 390px;
      height: 460px;
      border-radius: 96px 0 0 0;
      border: 2.5px solid rgba(216, 175, 99, 0.48);
      background: linear-gradient(135deg, rgba(216, 175, 99, 0.14) 0%, rgba(10, 7, 4, 0.85) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 28px 64px rgba(0, 0, 0, 0.75);
      flex-shrink: 0;
    }
    .monogram-box span {
      font-family: var(--font-display);
      font-size: 224px;
      font-weight: 600;
      color: var(--off-white);
      line-height: 1;
    }
    .brand-wordmark {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .brand-wordmark .main {
      font-family: var(--font-display);
      font-size: 152px;
      font-weight: 600;
      letter-spacing: 0.14em;
      line-height: 0.96;
      color: var(--off-white);
    }
    .brand-wordmark .sub {
      font-size: 52px;
      font-weight: 500;
      letter-spacing: 0.44em;
      color: var(--gold-primary);
      text-transform: uppercase;
      padding-left: 6px;
    }
    .brand-wordmark .editorial-tagline {
      font-family: var(--font-editorial);
      font-style: italic;
      font-size: 46px;
      color: var(--muted-cream);
      margin-top: 8px;
      letter-spacing: 0.02em;
    }

    .circular-seal {
      width: 320px;
      height: 320px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 10px;
      flex-shrink: 0;
    }
    .circular-seal svg {
      width: 100%;
      height: 100%;
      animation: slowSpin 48s linear infinite;
    }
    .circular-seal .seal-center-dot {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--gold-primary);
      box-shadow: 0 0 18px rgba(216, 175, 99, 0.8);
    }

    .panel-nav-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }
    .panel-nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 32px 48px;
      border-radius: 16px;
      border-left: 8px solid transparent;
      background: transparent;
      cursor: pointer;
      transition: all 0.35s ease;
    }
    .panel-nav-item:hover {
      background: rgba(216, 175, 99, 0.08);
    }
    .panel-nav-item.active {
      border-left-color: var(--gold-primary);
      background: linear-gradient(90deg, rgba(216, 175, 99, 0.16) 0%, rgba(216, 175, 99, 0.03) 100%);
    }
    .panel-nav-left {
      display: flex;
      align-items: center;
      gap: 40px;
    }
    .panel-nav-bullet {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2.5px solid rgba(216, 175, 99, 0.5);
      transition: all 0.35s ease;
    }
    .panel-nav-item.active .panel-nav-bullet {
      background: var(--gold-light);
      border-color: var(--gold-light);
      box-shadow: 0 0 18px var(--gold-primary);
    }
    .panel-nav-label {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: rgba(247, 243, 235, 0.48);
      text-transform: uppercase;
      transition: color 0.35s ease;
    }
    .panel-nav-item.active .panel-nav-label {
      color: var(--off-white);
    }
    .panel-nav-square {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(216, 175, 99, 0.45);
      transition: all 0.35s ease;
    }
    .panel-nav-item.active .panel-nav-square {
      background: var(--off-white);
      border-color: var(--off-white);
    }

    .right-top-group {
      display: flex;
      flex-direction: column;
      gap: 28px;
      width: 100%;
    }
    .right-active-card {
      padding: 34px 48px;
      border-radius: 24px;
      border: 1.5px solid rgba(216, 175, 99, 0.32);
      background: rgba(16, 11, 6, 0.72);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .right-active-kicker {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.28em;
      color: var(--gold-primary);
      text-transform: uppercase;
    }
    .right-active-title {
      font-family: var(--font-editorial);
      font-size: 56px;
      font-weight: 600;
      color: var(--off-white);
      line-height: 1.05;
    }
    .right-active-folder {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--muted-cream);
      text-transform: uppercase;
    }
    .panel-dots {
      display: flex;
      gap: 18px;
      margin-top: 8px;
    }
    .panel-dot {
      height: 12px;
      width: 54px;
      border-radius: 999px;
      background: rgba(216, 175, 99, 0.24);
      transition: all 0.4s ease;
    }
    .panel-dot.active {
      width: 124px;
      background: linear-gradient(90deg, var(--gold-primary), var(--gold-light));
      box-shadow: 0 0 22px rgba(216, 175, 99, 0.65);
    }

    .right-progress-bars {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      width: 100%;
    }
    .right-prog-seg {
      height: 8px;
      border-radius: 999px;
      background: rgba(247, 243, 235, 0.16);
      cursor: pointer;
      transition: all 0.4s ease;
    }
    .right-prog-seg.active {
      background: linear-gradient(90deg, var(--gold-primary), var(--gold-light));
      box-shadow: 0 0 24px rgba(216, 175, 99, 0.7);
    }

    .right-emblem-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 56px;
      margin: auto 0;
    }
    .right-circle-crest {
      width: 580px;
      height: 580px;
      border-radius: 50%;
      border: 2px solid rgba(216, 175, 99, 0.32);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: radial-gradient(circle, rgba(216, 175, 99, 0.12) 0%, transparent 70%);
    }
    .right-circle-crest::before {
      content: "";
      position: absolute;
      inset: 28px;
      border-radius: 50%;
      border: 2px dashed rgba(216, 175, 99, 0.42);
      animation: slowSpin 65s linear infinite;
    }
    .right-circle-crest span {
      font-family: var(--font-display);
      font-size: 210px;
      font-weight: 500;
      color: var(--gold-primary);
    }
    .right-mode-caption {
      font-size: 36px;
      font-weight: 600;
      letter-spacing: 0.36em;
      color: rgba(247, 243, 235, 0.62);
      text-transform: uppercase;
      text-align: center;
    }

    .right-bottom-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
    }
    .meta-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .meta-col.right {
      text-align: right;
      align-items: flex-end;
    }
    .meta-kicker {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 0.34em;
      color: rgba(247, 243, 235, 0.52);
      text-transform: uppercase;
    }
    .meta-value {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--off-white);
      text-transform: uppercase;
    }

    #center-stage {
      position: absolute;
      left: 25%;
      width: 50%;
      top: 0;
      bottom: 0;
      z-index: 20;
      overflow: hidden;
    }

    #panel-group-view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 108px 180px 128px 180px;
      transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1), transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #stage.is-floating #panel-group-view {
      opacity: 0;
      transform: scale(0.985);
      pointer-events: none;
    }

    .center-top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .center-top-meta .left-tag {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 0.32em;
      color: var(--gold-primary);
      text-transform: uppercase;
    }
    .center-top-meta .right-tag {
      font-size: 36px;
      font-weight: 600;
      letter-spacing: 0.32em;
      color: rgba(247, 243, 235, 0.65);
      text-transform: uppercase;
    }

    .panel-header-center {
      text-align: center;
      margin-top: -12px;
      margin-bottom: 24px;
    }
    .panel-header-center .headline {
      font-family: var(--font-display);
      font-size: 132px;
      font-weight: 600;
      letter-spacing: 0.09em;
      color: var(--off-white);
      text-shadow: 0 12px 44px rgba(0, 0, 0, 0.8);
    }

    .speakers-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 44px;
      height: 1440px;
      width: 100%;
    }

    .speaker-card {
      position: relative;
      height: 100%;
      border-radius: 30px;
      overflow: hidden;
      border: 2px solid rgba(216, 175, 99, 0.32);
      background:
        radial-gradient(circle at 50% 24%, rgba(244, 220, 168, 0.24) 0%, rgba(120, 92, 54, 0.18) 45%, rgba(14, 10, 6, 0.96) 100%);
      box-shadow: 0 28px 64px rgba(0, 0, 0, 0.82);
      cursor: pointer;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .speaker-card:hover {
      transform: translateY(-24px) scale(1.025);
      border-color: var(--gold-light);
      box-shadow: 0 36px 84px rgba(216, 175, 99, 0.28);
      z-index: 15;
    }

    .card-top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 86px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(255, 250, 240, 0.14) 0%, transparent 100%);
      z-index: 6;
      pointer-events: none;
    }
    .card-index {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--gold-light);
    }
    .card-dots {
      display: flex;
      gap: 10px;
    }
    .card-dots i {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(247, 243, 235, 0.55);
      display: block;
    }

    .speaker-card img.portrait {
      position: absolute;
      bottom: 130px;
      left: 50%;
      transform: translateX(-50%);
      width: 112%;
      height: 1210px;
      object-fit: cover;
      object-position: top center;
      z-index: 3;
      filter: drop-shadow(0 20px 36px rgba(0, 0, 0, 0.85));
      transition: transform 0.45s ease;
    }
    .speaker-card:hover img.portrait {
      transform: translateX(-50%) scale(1.04);
    }

    .speaker-card-footer {
      position: absolute;
      inset: auto 0 0 0;
      height: 380px;
      padding: 0 22px 44px 22px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      text-align: center;
      background: linear-gradient(180deg, transparent 0%, rgba(8, 6, 4, 0.9) 46%, rgba(6, 4, 2, 0.99) 100%);
      z-index: 5;
    }
    .speaker-card-footer .sp-niche {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--gold-primary);
      text-transform: uppercase;
      margin-bottom: 10px;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .speaker-card-footer .sp-name {
      font-family: var(--font-display);
      font-size: 44px;
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: 0.06em;
      color: var(--off-white);
      text-transform: uppercase;
    }

    /* =========================================================================
       DESTAQUE INDIVIDUAL — ANIMAÇÃO SUAVE E ELEGANTE DE FADE IN NÃO-PADRÃO
       Combina opacidade serena + micro-respiro de escala (1.022 -> 1.0)
       e desfoque sutil resolvendo (4px -> 0px) com curva editorial.
       ========================================================================= */
    #spotlight-view {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transform: scale(1.015);
      filter: blur(4px);
      transition:
        opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.78s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.68s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #stage.is-floating #spotlight-view {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
      filter: blur(0);
    }

    .spotlight-arch-frame {
      position: absolute;
      inset: 76px 140px;
      border-radius: 84px;
      border: 2.5px solid rgba(216, 175, 99, 0.36);
      box-shadow:
        inset 0 0 120px rgba(216, 175, 99, 0.08),
        0 0 90px rgba(0, 0, 0, 0.75);
      pointer-events: none;
      z-index: 35;
    }

    .spotlight-top-meta {
      position: absolute;
      top: 136px;
      left: 240px;
      right: 240px;
      display: flex;
      align-items: center;
      gap: 44px;
      z-index: 36;
      pointer-events: none;
    }
    .spotlight-top-meta span {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--gold-light);
      white-space: nowrap;
    }
    .spotlight-top-meta .meta-rule {
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, rgba(216, 175, 99, 0.65), rgba(216, 175, 99, 0.15), rgba(216, 175, 99, 0.65));
    }

    .spotlight-halo-disc {
      position: absolute;
      width: 1940px;
      height: 1940px;
      border-radius: 50%;
      top: 46%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.965);
      background:
        radial-gradient(circle at 50% 34%, #f4dca8 0%, #d8af63 32%, #9a6c25 66%, rgba(42, 26, 9, 0.15) 94%, transparent 100%);
      box-shadow:
        0 0 240px rgba(216, 175, 99, 0.45),
        inset 0 -140px 200px rgba(12, 8, 4, 0.72);
      z-index: 5;
      opacity: 0;
      transition:
        transform 0.95s cubic-bezier(0.22, 1, 0.36, 1) 0.06s,
        opacity 0.78s cubic-bezier(0.22, 1, 0.36, 1) 0.06s;
    }
    #stage.is-floating .spotlight-halo-disc {
      opacity: 0.95;
      transform: translate(-50%, -50%) scale(1);
    }

    .spotlight-halo-ring {
      position: absolute;
      width: 2120px;
      height: 2120px;
      border-radius: 50%;
      top: 46%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 2px dashed rgba(244, 220, 168, 0.28);
      z-index: 6;
      animation: slowSpin 75s linear infinite;
      pointer-events: none;
    }
    @keyframes slowSpin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .spotlight-back-word {
      position: absolute;
      top: 210px;
      left: 50%;
      transform: translateX(-50%) scale(1.02);
      font-family: var(--font-display);
      font-size: 550px;
      font-weight: 800;
      line-height: 0.88;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
      background: linear-gradient(180deg, rgba(255, 250, 240, 0.95) 0%, rgba(244, 220, 168, 0.78) 58%, rgba(164, 118, 46, 0.35) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      z-index: 10;
